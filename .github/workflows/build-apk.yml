name: Build and Release LineForge v1.1 APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

# Required for creating tags/releases with the built-in GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Bluetooth protocol parser
        run: |
          mkdir -p build/protocol-test
          javac -d build/protocol-test \
            app/src/main/java/com/lineforge/lfr/Protocol.java \
            tests/ProtocolSelfTest.java
          java -cp build/protocol-test com.lineforge.lfr.ProtocolSelfTest

      - name: Install Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: LineForge-LFR-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # On pushes to main/master: create a uniquely tagged preview Release.
      # On v1.2.3 tags: create a versioned Release.
      # On reruns: replace the existing APK asset on that same Release.
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            TAG="$GITHUB_REF_NAME"
            TITLE="LineForge LFR $TAG"
            STABLE=true
          else
            TAG="build-${GITHUB_RUN_NUMBER}"
            TITLE="LineForge LFR preview $TAG"
            STABLE=false
          fi

          mkdir -p dist
          APK="dist/LineForge-LFR-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          FIRMWARE="dist/LineForge-ESP32S3-firmware-${TAG}.ino"
          cp ESP32S3_LFR_BT_NVS_LineForge_v2/ESP32S3_LFR_BT_NVS_LineForge_v2.ino "$FIRMWARE"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG. Updating its APK asset."
            gh release upload "$TAG" "$APK" "$FIRMWARE" --clobber
          elif [[ "$STABLE" == true ]]; then
            gh release create "$TAG" "$APK" "$FIRMWARE" \
              --verify-tag \
              --title "$TITLE" \
              --generate-notes
          else
            gh release create "$TAG" "$APK" "$FIRMWARE" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "Automatic test APK and matched ESP32-S3 firmware from commit $GITHUB_SHA. This is a debug-signed APK; signature changes may require uninstalling the previous version first." \
              --prerelease \
              --latest=false
          fi
